version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ponedoras
      POSTGRES_PASSWORD: ponedoras
      POSTGRES_DB: ponedoras
    ports:
      - "5432:5432"
    volumes:
      - ponedoras_db_data:/var/lib/postgresql/data

volumes:
  ponedoras_db_data:
